<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6549d5" />
    <title>You're offline | Medical</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f7f6fb;
        color: #242135;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        border: 1px solid #e8e4f2;
        border-radius: 1.25rem;
        background: white;
        box-shadow: 0 1rem 3rem #32225c14;
      }

      h1 {
        margin-top: 0;
        color: #6549d5;
      }

      a {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 0.6rem;
        background: #6549d5;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Your connection is unavailable. Reconnect to sign in or make account
        changes. We do not store passwords or medical information for offline
        submission.
      </p>
      <a href="/">Try the app again</a>
    </main>
  </body>
</html>
